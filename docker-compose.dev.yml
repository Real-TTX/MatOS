# MatOS – development stack: builds the image from the source in this folder.
# The only other service is a SQLite web viewer (the SQLite counterpart of pgAdmin).
#   ./scripts/redeploy.ps1            (rebuilds the container and redeploys the stack)
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Web:        http://localhost:8030      (MATOS_PORT changes the host port)
# SQLite web: http://localhost:8021      (MATOS_DB_PORT changes the host port)
name: matos-dev

services:
  matos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        Channel: ${MATOS_CHANNEL:-local}
        BuildNumber: ${MATOS_BUILD_NUMBER:-0}
        BuildDate: ${MATOS_BUILD_DATE:-}
    image: matos:dev
    container_name: matos-dev
    restart: unless-stopped
    ports:
      - "${MATOS_PORT:-8030}:8030"
    environment:
      # Development seeds a ready-to-use account (admin@example.com / Start12345) so testing never touches the real admin.
      ASPNETCORE_ENVIRONMENT: Development
      # The shared network of the engines and apps: an explicit subnet for the same reason as below (empty = Docker chooses).
      MatOS__NetworkSubnet: ${MATOS_NETWORK_SUBNET:-}
    volumes:
      - matos-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  sqlite-web:
    image: coleifer/sqlite-web:latest
    container_name: matos-dev-sqlite-web
    restart: unless-stopped
    depends_on:
      - matos
    ports:
      - "${MATOS_DB_PORT:-8021}:8080"
    environment:
      SQLITE_DATABASE: /data/matos.db
    volumes:
      - matos-data:/data

volumes:
  matos-data:

# An explicit subnet: on a machine with many stacks Docker can run out of its default address pools
# ("all predefined address pools have been fully subnetted"). Override with MATOS_DEV_SUBNET if this range collides.
networks:
  default:
    ipam:
      config:
        - subnet: ${MATOS_DEV_SUBNET:-10.253.90.0/24}
