<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="matOS">
  <defs>
    <linearGradient id="matosBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C6BFF"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="matosTileAccent" x1="106" y1="274" x2="238" y2="406" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34E7E4"/>
      <stop offset="1" stop-color="#22B8FF"/>
    </linearGradient>
    <filter id="matosShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#matosBg)" filter="url(#matosShadow)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <!-- app-grid mark: four rounded tiles like a desktop launcher -->
  <rect x="106" y="106" width="132" height="132" rx="36" fill="#ffffff" fill-opacity="0.96"/>
  <rect x="274" y="106" width="132" height="132" rx="36" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="106" y="274" width="132" height="132" rx="36" fill="url(#matosTileAccent)"/>
  <rect x="274" y="274" width="132" height="132" rx="36" fill="#ffffff" fill-opacity="0.80"/>
</svg>
