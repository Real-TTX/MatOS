# Nginx Proxy Manager – an alternative reverse proxy.
x-matos:
  id: nginx-proxy-manager
  name: Nginx Proxy Manager
  tagline: Reverse proxy with a friendly UI
  description: >-
    Proxy hosts, redirects and free Let's Encrypt certificates, managed in a web UI.
    MatOS cannot create the routes for you; add a proxy host that forwards to the container name shown on the app page.
  category: Infrastructure
  role: proxy
  state: third-party
  stateNote: Needs the ports 80 and 443 that Matcad uses.
  homepage: https://nginxproxymanager.com
  ui:
    service: app
    port: 81
    hostPort: 81
  shared: [app]
  notes:
    - Needs the host ports 80 and 443. Stop any other web server or proxy that uses them first.
  credentials:
    - label: First sign-in
      value: Nginx Proxy Manager asks you to create the administrator account.

services:
  app:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - data:/data
      - letsencrypt:/etc/letsencrypt

volumes:
  data:
  letsencrypt:
