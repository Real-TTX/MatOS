# Immich – photos and videos from your phone (https://immich.app). The stack of its own compose file: server, machine learning, Valkey, PostgreSQL.
x-matos:
  id: immich
  name: Immich
  tagline: Your photos and videos, backed up from the phone
  description: >-
    Immich backs up the photos and videos of your phones by itself and shows them on a timeline, on a map and in albums. It recognises faces
    and finds pictures by what they show ("dog on the beach"). Share albums with family and friends.
  category: Media
  role: app
  state: third-party
  stateNote: Its single sign-on and mail are set in its own administration (or a config file that locks every setting), so MatOS does not connect them yet.
  icon: immich.svg
  homepage: https://immich.app
  screenshots:
    - src: immich/first-start.webp
      caption: The first start
  ui:
    service: immich-server
    port: 2283
    hostPort: 2283
  variables:
    - key: DB_PASSWORD
      type: secret
      generate: true
      hidden: true
  notes:
    - On the first visit Immich asks you to create the administrator account. The apps for Android and iOS sign in with the address of this app.
    - Recognising faces and searching by content run on the processor and need a few GB of memory while the library is read for the first time.
    - "To sign in through MatIdentity: Administration, Settings, OAuth in Immich, with an app of MatIdentity (Apps) whose redirect addresses are <address>/auth/login and <address>/user-settings."
  credentials:
    - label: First sign-in
      value: Immich asks you to create the administrator account.

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3
    restart: unless-stopped
    depends_on:
      - redis
      - database
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
      TZ: ${TZ:-UTC}
    volumes:
      - immich-library:/data

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3
    restart: unless-stopped
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
    volumes:
      - immich-model-cache:/cache

  redis:
    image: docker.io/valkey/valkey:9
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    # The PostgreSQL of Immich, with the vector search it needs (as in Immich's own compose file).
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    shm_size: 128mb
    volumes:
      - immich-db:/var/lib/postgresql/data

volumes:
  immich-library:
  immich-model-cache:
  immich-db:
