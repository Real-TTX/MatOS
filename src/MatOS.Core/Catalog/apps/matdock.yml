# MatDock – Docker manager for servers (the advanced Docker management).
x-matos:
  id: matdock
  name: MatDock
  tagline: Advanced Docker management
  description: >-
    Stacks, containers, volumes, live logs, a web terminal and scheduled backups across many hosts over SSH.
    Use it where MatOS stops: managing other servers, migrating volumes and backups to a NAS.
  category: Infrastructure
  role: docker
  icon: matdock.svg
  homepage: https://github.com/Real-TTX/MatDock
  recommended: true
  provision: matdock
  core: true
  # The platform contract (/api) and the sign-in through MatIdentity: MatOS fills MAT_API_KEY, MAT_FRAME_ANCESTORS and MATIDENTITY_*.
  platform: true
  # What the app uses of the engines (MatDesign docs/PLATFORM.md "Capabilities"): MatOS binds each when its engine is installed.
  consumes:
    - capability: identity.oidc   # the sign-in through MatIdentity (MATIDENTITY_*)
    - capability: mail.smtp       # its mail through MatSMTP (MATSMTP_*)
  ui:
    service: matdock
    port: 4455
    hostPort: 4455
  variables:
    - key: MATDOCK_API_KEY
      label: API key
      type: secret
      generate: true
      hidden: true
    - key: ADMIN_PASSWORD
      label: Admin password
      type: secret
      generate: true
      help: The initial password of the user "admin" (MatDock asks to change it on the first sign-in). Leave empty to generate one.
  notes:
    - MatOS deploys, updates and backs up its apps as stacks in MatDock. You see them there with a "Managed by matos" badge and can change them.
  credentials:
    - label: Username
      value: admin
    - label: Password
      value: ${ADMIN_PASSWORD}
      secret: true
    - label: Note
      value: The local Docker engine is added automatically under Environments.

services:
  matdock:
    # MatDock publishes :release (and version tags) but no :latest.
    image: ghcr.io/real-ttx/matdock:release
    restart: unless-stopped
    environment:
      MatDock__DataPath: /data
      MatDock__Admin__Seed: "true"
      MatDock__Admin__Username: admin
      MatDock__Admin__Password: ${ADMIN_PASSWORD}
      MatDock__Api__Key: ${MATDOCK_API_KEY}
      MatDock__Environments__EnsureLocal: "true"
      MAT_API_KEY: ${MAT_API_KEY}
      # The addresses of MatOS, which may show it in the window of its home screen (MatDesign docs/PLATFORM.md); empty: nobody may frame it.
      MAT_FRAME_ANCESTORS: ${MAT_FRAME_ANCESTORS:-}
      MATIDENTITY_AUTHORITY: ${MATIDENTITY_AUTHORITY:-}
      MATIDENTITY_INTERNAL_URL: ${MATIDENTITY_INTERNAL_URL:-}
      MATIDENTITY_CLIENT_ID: ${MATIDENTITY_CLIENT_ID:-}
      MATIDENTITY_CLIENT_SECRET: ${MATIDENTITY_CLIENT_SECRET:-}
      MATSMTP_HOST: ${MATSMTP_HOST:-}
      MATSMTP_PORT: ${MATSMTP_PORT:-}
      MATSMTP_USERNAME: ${MATSMTP_USERNAME:-}
      MATSMTP_PASSWORD: ${MATSMTP_PASSWORD:-}
      MATSMTP_FROM: ${MATSMTP_FROM:-}
      MATSMTP_TLS: ${MATSMTP_TLS:-}
    volumes:
      - matdock-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  matdock-data:
