# MatAi – the AI of the Mat family (an OpenAI-compatible gateway, a chat, public assistants).
x-matos:
  id: matai
  name: MatAi
  tagline: Chat with AI and build assistants
  description: One place for the AI of your apps - an OpenAI-compatible gateway in front of OpenAI, Anthropic, Gemini, Mistral, Azure OpenAI and your own Ollama, with routes, fallbacks, limits and costs, a chat for the people of this MatOS and public assistants for websites.
  category: Productivity
  role: app
  state: preview
  stateNote: The image is not published yet.
  icon: matai.svg
  homepage: https://github.com/Real-TTX/MatAi
  # The platform contract (/api): MatOS fills MAT_API_KEY. MatAi sends no mail, so there is no mail.smtp.
  platform: true
  # What the app uses of the engines (MatDesign docs/PLATFORM.md "Capabilities"): MatOS binds each when its engine is installed.
  consumes:
    - capability: identity.oidc   # the sign-in through MatIdentity (MATIDENTITY_*)
  ui:
    service: matai
    port: 2301
    hostPort: 2301
  variables:
    # The key of MatAi's own API /api/v1 (clients, settings): generated, nobody types it.
    - key: MATAI_API_KEY
      label: API key
      type: secret
      generate: true
      hidden: true
    # Seeds the administrator "admin", so there is no first-run page: with MatIdentity nobody needs it, without it is the first sign-in.
    - key: MATAI_ADMIN_PASSWORD
      label: Administrator password
      type: secret
      generate: true
      hidden: true
  notes:
    - MatAi brings no model of its own. Add a provider under Profiles (an API key of OpenAI, Anthropic, Gemini, Mistral, or the address of your Ollama) before the chat answers.
    - The volume matai-data holds the database and the keys that encrypt the provider keys; back it up like a password safe.
  credentials:
    - label: Username (without MatIdentity)
      value: admin
    - label: Password
      value: ${MATAI_ADMIN_PASSWORD}
      secret: true

services:
  matai:
    image: ghcr.io/real-ttx/matai:latest
    restart: unless-stopped
    environment:
      MATAI_API_KEY: ${MATAI_API_KEY}
      MATAI_ADMIN_PASSWORD: ${MATAI_ADMIN_PASSWORD}
      MAT_API_KEY: ${MAT_API_KEY}
      MATIDENTITY_AUTHORITY: ${MATIDENTITY_AUTHORITY:-}
      MATIDENTITY_INTERNAL_URL: ${MATIDENTITY_INTERNAL_URL:-}
      MATIDENTITY_CLIENT_ID: ${MATIDENTITY_CLIENT_ID:-}
      MATIDENTITY_CLIENT_SECRET: ${MATIDENTITY_CLIENT_SECRET:-}
    volumes:
      - matai-data:/data

volumes:
  matai-data:
