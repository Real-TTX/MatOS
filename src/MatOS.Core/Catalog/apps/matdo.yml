# MatDo – tasks, projects and teams.
x-matos:
  id: matdo
  name: MatDo
  tagline: Tasks, projects and teams
  description: Tasks like Todoist - a quick add in German and English, projects with sections and sub-tasks, teams, notifications and a webhook for dictation.
  category: Productivity
  role: app
  icon: matdo.svg
  homepage: https://github.com/Real-TTX/MatDo
  # The platform contract (/api): MatOS fills MAT_API_KEY.
  # MatDo sends no mail (reminders are Web Push), so there is no mail: {}.
  platform: true
  # What the app uses of the engines (MatDesign docs/PLATFORM.md "Capabilities"): MatOS binds each when its engine is installed.
  consumes:
    - capability: identity.oidc   # the sign-in through MatIdentity (MATIDENTITY_*)
  ui:
    service: web
    port: 6006
    hostPort: 6006
    # With MatIdentity the app is opened here: its sign-in goes straight on to MatIdentity and back into the app, so nobody meets the start page with its buttons.
    signIn: /Account/Login
  variables:
    # Seeds the administrator, so nothing is set up after the install: with MatIdentity nobody needs it, without it is the first sign-in.
    - key: MATDO_ADMIN_PASSWORD
      label: Administrator password
      type: secret
      generate: true
      hidden: true
    - key: DB_PASSWORD
      label: Database password
      type: secret
      generate: true
      hidden: true
    - key: TIMEZONE
      label: Time zone
      default: Europe/Berlin
      advanced: true
  notes:
    - The PostgreSQL database is only reachable inside the stack.
  credentials:
    - label: E-mail (without MatIdentity)
      value: admin@matdo.local
    - label: Password
      value: ${MATDO_ADMIN_PASSWORD}
      secret: true

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matdo
      POSTGRES_USER: matdo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TIMEZONE:-Europe/Berlin}
    volumes:
      # New volumes for the rewritten app: its migrations do not run on the database of the old Matdo.
      - matdo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matdo -d matdo"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/real-ttx/matdo:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=matdo;Username=matdo;Password=${DB_PASSWORD}"
      TZ: ${TIMEZONE:-Europe/Berlin}
      MAT_API_KEY: ${MAT_API_KEY}
      MATDO_ADMIN_PASSWORD: ${MATDO_ADMIN_PASSWORD}
      MATIDENTITY_AUTHORITY: ${MATIDENTITY_AUTHORITY:-}
      MATIDENTITY_INTERNAL_URL: ${MATIDENTITY_INTERNAL_URL:-}
      MATIDENTITY_CLIENT_ID: ${MATIDENTITY_CLIENT_ID:-}
      MATIDENTITY_CLIENT_SECRET: ${MATIDENTITY_CLIENT_SECRET:-}
    volumes:
      - matdo-data:/data

volumes:
  matdo-db:
  matdo-data:
