# MatCMS – block-based CMS.
x-matos:
  id: matcms
  name: MatCMS
  tagline: Build your own website from blocks
  description: Build and publish websites from blocks, with plugins, multi-site support and built-in backups.
  category: Websites
  role: app
  state: beta
  stateNote: Joins a MatCMS Cloud installed beside it by itself; no sign-in through MatIdentity yet (its own accounts).
  icon: matcms.svg
  homepage: https://github.com/Real-TTX/MatCMS
  # Pictures for its page in the store: files below wwwroot/img/store (taken from the app's repository).
  screenshots:
    - src: matcms/home.webp
      caption: A website
    - src: matcms/page-editor.webp
      caption: The page editor
    - src: matcms/dashboard.webp
      caption: Overview
  # What MatCMS uses of other apps (MatCMS has no /api of the contract, so its entry says it): cms.cloud, the link to a MatCMS Cloud
  # installed beside it. The broker passes MAT_CMS_CLOUD_URL, _INTERNAL_URL and _KEY, and the site joins the cloud by itself (no join code).
  consumes:
    - capability: cms.cloud
  ui:
    service: matcms
    port: 8080
    hostPort: 9101
  credentials:
    - label: Username
      value: admin
    - label: Password
      value: admin
    - label: Note
      value: Change this password after the first sign-in.

services:
  matcms:
    image: ghcr.io/real-ttx/matcms:latest
    restart: unless-stopped
    volumes:
      # Database, keys, uploads and backups: everything lives here.
      - matcms-data:/app/appdata

volumes:
  matcms-data:
