# MatPaper – document management.
x-matos:
  id: matpaper
  name: MatPaper
  tagline: Your papers scanned, filed and found
  description: Scan or upload documents, let them be recognised and filed, and find them again in seconds.
  category: Files
  role: app
  state: beta
  stateNote: Works with one sign-in; not yet tested end to end through MatOS.
  icon: matpaper.svg
  homepage: https://github.com/Real-TTX/MatPaper
  # Pictures for its page in the store: files below wwwroot/img/store (taken from the app's repository).
  screenshots:
    - src: matpaper/inbox.webp
      caption: The inbox
    - src: matpaper/documents.webp
      caption: Documents
    - src: matpaper/document-detail.webp
      caption: A document
  # The platform contract (/api): MatOS fills MAT_API_KEY.
  platform: true
  # What the app uses of the engines (MatDesign docs/PLATFORM.md "Capabilities"): MatOS binds each when its engine is installed.
  consumes:
    - capability: identity.oidc   # the sign-in through MatIdentity (MATIDENTITY_*)
  ui:
    service: matpaper
    port: 8080
    hostPort: 4994
    # With MatIdentity the app is opened here: its sign-in goes straight on to MatIdentity and back into the app.
    signIn: /Account/Login
  variables:
    # Seeds the administrator "admin", so there is no setup page: with MatIdentity nobody needs it, without it is the first sign-in.
    - key: MATPAPER_ADMIN_PASSWORD
      label: Administrator password
      type: secret
      generate: true
      hidden: true
  notes:
    - The PostgreSQL database is only reachable inside the stack, so its default password is not exposed.
  credentials:
    - label: Username (without MatIdentity)
      value: admin
    - label: Password
      value: ${MATPAPER_ADMIN_PASSWORD}
      secret: true

services:
  matpaper:
    image: ghcr.io/real-ttx/matpaper:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MAT_API_KEY: ${MAT_API_KEY}
      MAT_FRAME_ANCESTORS: ${MAT_FRAME_ANCESTORS:-}
      MATPAPER_ADMIN_PASSWORD: ${MATPAPER_ADMIN_PASSWORD}
      MATIDENTITY_AUTHORITY: ${MATIDENTITY_AUTHORITY:-}
      MATIDENTITY_INTERNAL_URL: ${MATIDENTITY_INTERNAL_URL:-}
      MATIDENTITY_CLIENT_ID: ${MATIDENTITY_CLIENT_ID:-}
      MATIDENTITY_CLIENT_SECRET: ${MATIDENTITY_CLIENT_SECRET:-}
    volumes:
      - matpaper-data:/data
      - matpaper-storage:/storage

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: matpaper
      POSTGRES_DB: matpaper
    volumes:
      - matpaper-db:/var/lib/postgresql/data

volumes:
  matpaper-data:
  matpaper-storage:
  matpaper-db:
