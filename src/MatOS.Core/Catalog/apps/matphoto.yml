# MatPhoto – photos and videos from your storages (NAS, SMB, WebDAV): albums as folders, lists, places, people, duplicates and a smart import.
x-matos:
  id: matphoto
  name: MatPhoto
  tagline: Your photos, straight from your NAS
  description: Photos and videos from your storages (a NAS over SMB, SFTP, FTP or WebDAV) - a timeline, albums as folders, lists, places found offline, faces grouped into people on the server, duplicates, shared links and a smart import that suggests albums by time and place.
  category: Media
  role: app
  state: beta
  stateNote: Works with one sign-in; not yet tested end to end through MatOS.
  icon: matphoto.svg
  homepage: https://github.com/Real-TTX/MatPhoto
  # Pictures for its page in the store: files below wwwroot/img/store (taken from the app's repository).
  screenshots:
    - src: matphoto/photos.webp
      caption: Your photos
    - src: matphoto/viewer.webp
      caption: The viewer
    - src: matphoto/explore.webp
      caption: Explore
  # The platform contract (/api): MatOS fills MAT_API_KEY.
  platform: true
  # What the app uses of the engines (MatDesign docs/PLATFORM.md "Capabilities"): MatOS binds each when its engine is installed and passes the variables
  # of the binding to the web service by itself. MatPhoto says the same in its /api.
  consumes:
    - capability: identity.oidc   # the sign-in through MatIdentity (MATIDENTITY_*)
    - capability: mail.smtp       # its mail through MatSMTP (MATSMTP_*)
  ui:
    service: web
    port: 4830
    hostPort: 4830
    # With MatIdentity the app is opened here: its sign-in goes straight on to MatIdentity and back into the app, so nobody meets the start page with its buttons.
    signIn: /Account/Login
  # A data folder the person may put on a volume of their own (docs/CATALOG.md "Data folders"): a photo share of the NAS through MatOS's Volumes, which
  # MatPhoto reads as a local storage below /storage. Without a choice it is the app's own volume matphoto-photos.
  folders:
    - volume: matphoto-photos
      name: Photo library
      purpose: "A folder of photos for MatPhoto: choose a volume of yours (a share of your NAS) and add /storage/photos as a local storage in MatPhoto."
  variables:
    - key: DB_PASSWORD
      label: Database password
      type: secret
      generate: true
      hidden: true
    - key: TIMEZONE
      label: Time zone
      default: Europe/Berlin
      advanced: true
  notes:
    - The first account that signs in is the administrator (with MatIdentity the first person who opens MatPhoto, without it the first who registers).
    - Then Administration → Storages → New storage - a share of your NAS (SMB, SFTP, FTP, WebDAV); the first scan starts at once.
    - Or put the Photo library (More options) on a volume of MatOS - a network share made under Volumes - and add the local folder /storage/photos as a storage.
    - The thumbnails and the cache lie in the volume matphoto-data; back it up together with the database volume matphoto-db (the photos stay on your storages).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: matphoto
      POSTGRES_USER: matphoto
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TIMEZONE:-Europe/Berlin}
    volumes:
      - matphoto-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matphoto -d matphoto"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/real-ttx/matphoto:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=matphoto;Username=matphoto;Password=${DB_PASSWORD}"
      TZ: ${TIMEZONE:-Europe/Berlin}
      MAT_API_KEY: ${MAT_API_KEY}
      MAT_FRAME_ANCESTORS: ${MAT_FRAME_ANCESTORS:-}
    volumes:
      - matphoto-data:/data
      - matphoto-photos:/storage/photos

volumes:
  matphoto-db:
  matphoto-data:
  matphoto-photos:
