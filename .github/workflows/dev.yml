name: dev

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version + image name
        id: v
        run: |
          date="$(date -u +%Y%m%d-%H%M)"
          echo "version=nightly-${{ github.run_number }}-${date}" >> "$GITHUB_OUTPUT"
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/matos" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Always pull base images so a stale gha cache can't pin us to an old
          # SDK/runtime layer that no longer matches the NuGet packages we restore.
          pull: true
          # The gha cache was breaking rebuilds (stale intermediate layers were
          # being reused with a fresher restore). Skip it — a fresh 5-second
          # publish is cheap enough.
          no-cache: true
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:nightly
