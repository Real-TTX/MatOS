name: dev

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version + image name
        id: v
        run: |
          date="$(date -u +%Y%m%d-%H%M)"
          echo "version=nightly-${{ github.run_number }}-${date}" >> "$GITHUB_OUTPUT"
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/matos" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Pin the target platform to what the runner actually is (amd64) so
          # buildx never silently tries to also build linux/arm64 under QEMU,
          # which is where dotnet SDK 10 has known crash reports.
          platforms: linux/amd64
          pull: true
          no-cache: true
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:nightly
