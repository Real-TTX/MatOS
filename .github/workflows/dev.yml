name: dev

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version + image name
        id: v
        run: |
          date="$(date -u +%Y%m%d-%H%M)"
          echo "version=nightly-${{ github.run_number }}-${date}" >> "$GITHUB_OUTPUT"
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/matos" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Manual buildx (instead of docker/build-push-action) so a failure's real output can be
      # surfaced as a check-run annotation — annotations are readable via the public API without
      # admin/log-download rights, which is what let us diagnose this build finally.
      - name: Build & push image
        run: |
          set +o pipefail
          docker buildx build \
            --platform linux/amd64 \
            --pull --no-cache \
            --build-arg APP_VERSION="${{ steps.v.outputs.version }}" \
            -t "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" \
            -t "${{ steps.v.outputs.image }}:nightly" \
            --push . 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            emit() { local esc; esc=$(printf '%s' "$1" | sed 's/%/%25/g; s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error::$esc"; }
            emit "DIAG: $(sed -n '/=== DIAG ===/,/=== \/DIAG ===/p' /tmp/build.log | head -c 1800)"
            emit "LOG TAIL: $(tail -c 2500 /tmp/build.log)"
          fi
          exit "$rc"
