# MatOS – release stack: as simple as it gets, one service and one data volume.
#   docker compose up -d
#
# Or without Compose, a single command:
#   docker run -d --name matos --restart unless-stopped -p 8030:8030 \
#     -v matos-data:/data -v /var/run/docker.sock:/var/run/docker.sock \
#     ghcr.io/real-ttx/matos:latest
#
# Web: http://localhost:8030  (the first start opens the setup wizard)
#
# Coming from Mattiverse (the name until 2026-11, volume mattiverse_mattiverse-data)? Remove its container (it must be gone before the copy;
# "docker compose -p mattiverse down" here would leave it running as an orphan), copy its volume once, then start this file:
#   docker stop mattiverse && docker rm mattiverse
#   docker compose up --no-start
#   docker run --rm -v mattiverse_mattiverse-data:/from -v matos_matos-data:/to busybox cp -a /from/. /to/
#   docker compose up -d
# MatOS takes over the database and keeps the network and the project names of the apps (README, "Upgrading from Mattiverse").
name: matos

services:
  matos:
    image: ghcr.io/real-ttx/matos:latest
    container_name: matos
    restart: unless-stopped
    ports:
      - "${MATOS_PORT:-8030}:8030"
    volumes:
      # Database, config, session keys, the compose files of all installed apps and the backups.
      - matos-data:/data
      # MatOS installs, updates and backs up the apps through the Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  matos-data:
