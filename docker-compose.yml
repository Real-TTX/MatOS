# MatOS – release stack: as simple as it gets, one service and one data volume.
#   docker compose up -d
#
# Or without Compose, a single command:
#   docker run -d --name matos --restart unless-stopped -p 8030:8030 \
#     -v matos-data:/data -v /var/run/docker.sock:/var/run/docker.sock \
#     ghcr.io/real-ttx/matos:latest
#
# Web: http://localhost:8030  (the first start opens the setup wizard)
name: matos

services:
  matos:
    image: ghcr.io/real-ttx/matos:latest
    container_name: matos
    restart: unless-stopped
    ports:
      - "${MATOS_PORT:-8030}:8030"
    volumes:
      # Database, config, session keys, the compose files of all installed apps and the backups.
      - matos-data:/data
      # MatOS installs, updates and backs up the apps through the Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  matos-data:
