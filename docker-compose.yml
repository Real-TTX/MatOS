# matOS — local / dev stack (builds matOS from source, runs the full stack:
# matOS + the sibling Matcad reverse-proxy (Caddy). "Complete stack always."
#
#   pwsh scripts/deploy.ps1            # rebuild + redeploy
#   docker compose up -d --build       # full stack
#   docker compose up -d matos         # matOS only (no GHCR pull for caddy/matcad)
#
# matOS UI:  http://localhost:4333
name: matos

services:
  matos:
    build:
      context: .
      args:
        APP_VERSION: ${MATOS_VERSION:-local}
    image: matos:local
    container_name: matos
    ports:
      - "4333:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      MATOS_VERSION: ${MATOS_VERSION:-local}
      MATOS_DATA_DIR: "/app/data"
      MatOS__Docker__Endpoint: "unix:///var/run/docker.sock"
      # Talk to the sibling Matcad's REST API (the Proxy app). Key must match matcad's Matcad__ApiKey.
      MatOS__Matcad__ApiUrl: "http://matcad:4433"
      MatOS__Matcad__ApiKey: "${MATCAD_API_KEY:-}"
    volumes:
      - matos-data:/app/data
      # matOS is a control panel for Docker -> it needs the engine socket (read+write).
      - /var/run/docker.sock:/var/run/docker.sock
      # Named-volume data, so the File Explorer can browse/edit and sizes can be read.
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks: [ matnet ]
    # Lets matOS reach apps' published ports on the host (used to check if an app allows embedding).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---- Reverse-proxy layer (sibling Matcad stack). Turns matcad.* labels into Caddy routes. ----
  caddy:
    image: ghcr.io/real-ttx/matcad-caddy:${MATCAD_VERSION:-latest}
    pull_policy: missing
    container_name: matos-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Compatibility-mode embedding: Caddy serves each app on a dedicated port here (framing headers
      # stripped) so apps embed as http://<host>:<port> without wildcard DNS. Must match matOS's
      # SystemConfig.EmbedPortStart/EmbedPortCount (default 21000 + 50 = 21000-21049).
      - "${MATOS_EMBED_PORTS:-21000-21049}:${MATOS_EMBED_PORTS:-21000-21049}"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [ matnet ]
    restart: unless-stopped

  matcad:
    image: ${MATCAD_IMAGE:-ghcr.io/real-ttx/matcad:${MATCAD_VERSION:-latest}}
    pull_policy: missing
    container_name: matos-matcad
    # Exposes the raw backend UI for the Proxy app's "Advanced" button (guarded by Matcad's own login).
    # Host 4436 -> container 4433 (4433 is a common default that may already be taken on the host).
    ports:
      - "${MATCAD_ADVANCED_PORT:-4436}:4433"
    environment:
      Matcad__DataDir: "/data"
      Matcad__ConfigDir: "/data/config"
      Matcad__Caddy__AdminUrl: "http://caddy:2019"
      # Enables Matcad's REST API for matOS. Empty = API disabled. Must match matOS's key.
      Matcad__ApiKey: "${MATCAD_API_KEY:-}"
    volumes:
      - matcad-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [ matnet ]
    restart: unless-stopped

volumes:
  matos-data:
  caddy-data:
  caddy-config:
  matcad-data:

networks:
  matnet:
    # Stable network name so matOS can attach installed app containers to it (M2)
    # and Matcad can dial them by container name.
    name: matos
